<h1>tanaka-stream</h1>
<p>tanaka-stream は、AI のキャラクター「田中」のライブ配信を、運営者自身の YouTube チャンネルで行うための、個人用のアプリです。</p>
<p>運営者のパソコンの中だけで動き、運営者本人のチャンネルにだけ使います。ほかの人に向けて配っているものではありません。</p>
<h2>このアプリがすること</h2>
<ul>
  <li>運営者のチャンネルに、ライブ配信の枠を作る・始める・終える</li>
  <li>ライブ配信のタイトル・説明・サムネイルを設定する</li>
  <li>運営者が作った動画を、運営者のチャンネルに載せる</li>
</ul>
